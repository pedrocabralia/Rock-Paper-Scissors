<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>

    <div id="escolher" class="sumir">

        <h1>PEDRA PAPEL E TESOURA</h1>

            <img src="img/papel.png" alt="" class="seleção"   id="papel">
            <img src="img/tesoura.png" alt="" class="seleção" id="tesoura">

     </div>

    <div id="escolhas" class="sumir">

            <h2>HUMANO</h2>

            </div>

            </div>

              <h2>VENCEDOR PARTIDA</h2>
         </div>
        </div>

          <tr>
              <th>ROBÔ</th>
              <th>HUMANO</th>
          </tr>

              <th id="pontuacaoRobo"></th>
